<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The Inn</title>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Poppins:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="styles.css">

</head>

<body>
    <div class="bar">
        <div class="logo">PIXL</div>
        <div class="chip"><i></i><span id="bal">120</span> <small>PX</small></div>
    </div>

    <div class="page">
        <h1>The Inn</h1>
        <div class="bal" id="ballnote"></div>
        <div class="note">Heads up: the pictures are placeholders for now. Orders are made in the order they come in and
            everything is in px. </div>
        <div class="cols">
            <section>
                <input class="search" id="q" type="q" type="text" placeholder="Search the menu..." autocomplete="off">
                <div class="chips" id="chips"></div>
                <div class="grid" id="grid"></div>
            </section>

            <aside class="order">
                <h2>Your Order</h2>
                <label for="who">Name</label>
                <input class="in" id="who" type="text" placeholder="who is this for?" autocomplete="off">
                <div id="lines">
                    <div class="empty">Nothing added yet</div>
                </div>
                <div class="tot"><span>Total</span><span id="total">0 PX</span></div>
                <label for="note">Note</label>
                <textarea class="in" id="note" placeholder="no onions etc."></textarea>
                <button class="go" id="go" disabled>Place order</button>
                <div class="ok" id="ok"></div>
            </aside>

        </div>






    </div>
    <script src="script.js"></script>
</body>

</html>
